name: Release

# Publishes a GitHub Release for a pushed version tag (v*). Does NOT rebuild — it finds
# build.yml's run for the exact commit the tag points to and republishes that run's already-built
# zip, so what's released is byte-identical to what was already validated on that commit.
#
# Just push the tag (git tag vX.Y.Z <commit> && git push origin vX.Y.Z). Do not manually create a
# Release yourself first — GitHub's immutable-release rule permanently retires a tag name the
# moment a release is published under it, so a manually-created Release racing this workflow
# burns the tag if anything goes wrong (this happened to v0.5.0; see CHANGELOG history).
#
# Requires build.yml to have already run successfully for the tagged commit — normally already
# true, since it runs on every push to main.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # to create the Release
  actions: read     # to look up and download build.yml's run/artifact

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Find matching Build run
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list -R "$GITHUB_REPOSITORY" --workflow=build.yml \
            --json databaseId,headSha,conclusion \
            --jq "[.[] | select(.headSha == \"${{ github.sha }}\" and .conclusion == \"success\")][0].databaseId")"
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful Build run found for commit ${{ github.sha }}. Build runs automatically on every push to main — check it ran and passed for this commit before tagging."
            exit 1
          fi
          echo "==> Using Build run $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: SeaPowerUX-zip
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Verify tag matches artifact version
        run: |
          set -euo pipefail
          ZIP="$(ls dist/SeaPowerUX-v*.zip 2>/dev/null || true)"
          if [ -z "$ZIP" ]; then
            echo "::error::No SeaPowerUX-v*.zip in the downloaded artifact."
            exit 1
          fi
          ZIP_VERSION="v$(basename "$ZIP" .zip | sed 's/^SeaPowerUX-v//')"
          if [ "${{ github.ref_name }}" != "$ZIP_VERSION" ]; then
            echo "::error::Tag ${{ github.ref_name }} doesn't match the built artifact ($ZIP_VERSION). Bump manifest.json, merge, then tag the new build."
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SeaPowerUX-v*.zip
          generate_release_notes: true
